# Deterministic end-to-end testbed for the TorStatus stack.
# A stub Tor control server serves canned descriptors/consensus so no real
# Tor bootstrap (or internet access) is needed. All assertions run inside
# the compose network via `docker compose exec nginx curl`.

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: torstatus
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../../../mariadb/sql:/docker-entrypoint-initdb.d/
    networks:
      - testbed
    healthcheck:
      test: "/usr/local/bin/healthcheck.sh --connect --innodb_initialized || exit 1"
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 24

  valkey:
    image: valkey/valkey:8-alpine
    networks:
      - testbed
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  tor:
    build:
      context: images/fake-tor
    networks:
      - testbed
    healthcheck:
      test: python3 -c "import socket; socket.create_connection(('localhost', 9051), 2).close()"
      interval: 2s
      timeout: 3s
      retries: 15

  updater:
    build:
      context: ../../
    environment:
      - TOR_CONTROL_PASSWORD=torstatus
    volumes:
      - ../../../nginx/web/config_docker.php:/opt/torstatus/config.php
      - ./geoip-data:/usr/share/tor:ro
    networks:
      - testbed
    depends_on:
      tor:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  php-fpm:
    build:
      context: ../../../php-fpm
    environment:
      - REAL_SERVER_IP=127.0.0.1
      - HIDDEN_SERVICE_URL=
    volumes:
      - ../../../nginx/web:/var/www/app/web
      - ../../../nginx/web/config_docker.php:/var/www/app/web/config.php
      - ../../../nginx/vendor:/var/www/app/vendor
    networks:
      - testbed
    healthcheck:
      test: "/usr/lib/nagios/plugins/check_tcp -H localhost -p 9000 || exit 1"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  nginx:
    image: nginx:latest
    volumes:
      - ../../../nginx/web:/var/www/app/web
      - ../../../nginx/web/config_docker.php:/var/www/app/web/config.php
      - ../../../nginx/vendor:/var/www/app/vendor
      - ../../../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - testbed
    depends_on:
      php-fpm:
        condition: service_healthy

volumes:
  mariadb-data:

networks:
  testbed:
